name: Update GitHub Stats

on:
  schedule:
    - cron: "0 18 * * *" # 00:00 Bhutan (UTC+6) == 18:00 UTC previous day
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests python-dateutil

      - name: Update README
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: python update_readme.py

      - name: Commit changes
        run: |
          git config --global user.name "divyashC-bot"
          git config --global user.email "actions@github.com"
          git add README.md
          git commit -m "auto: update README metrics" || echo "No changes"
          git push
